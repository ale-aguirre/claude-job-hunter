<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>job-hunter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c1b19'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%237fb99a'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#faf9f7; --fg:#1c1b19; --dim:#6b6862; --faint:#a3a09a; --line:#e2ded7;
    --hover:#f4f2ee; --ok:#2f6f4e; --warn:#8a5a2b; --bad:#8a2b2b;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#141412; --fg:#eceae6; --dim:#8f8b84; --faint:#5f5c57; --line:#2c2a27;
           --hover:#232120; --ok:#7fb99a; --warn:#c9a06a; --bad:#c98080; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       padding:2rem 1.25rem 4rem}
  main{max-width:70rem;margin:0 auto}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;
         padding-bottom:.9rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
  h1{font-size:1.35rem;font-weight:600;margin:0;letter-spacing:-.03em;
     font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
  .alerta{font-size:.82rem;color:var(--bad);font-weight:500}
  header .grow{flex:1}
  .ghost{background:none;border:1px solid var(--line);color:var(--dim)}
  .ghost[aria-pressed="true"]{color:var(--fg);border-color:var(--dim)}
  #q{font:inherit;font-size:.78rem;padding:.25rem .6rem;border:1px solid var(--line);
     border-radius:4px;background:none;color:var(--fg);width:13rem;
     transition:border-color .15s, width .2s ease}
  #q:focus{outline:none;border-color:var(--dim);width:16rem}

  /* Motion. Nada de librerías: HTML plano + CSS + WAAPI para lo que CSS no
     llega (colapso de filas al filtrar, apertura de paneles). Todo se apaga
     con prefers-reduced-motion. */
  .row{animation:fadeUp .3s cubic-bezier(.22,.61,.36,1) both;transition:background .15s}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .row:nth-child(1){animation-delay:.03s}.row:nth-child(2){animation-delay:.06s}
  .row:nth-child(3){animation-delay:.09s}.row:nth-child(4){animation-delay:.12s}
  .row:nth-child(5){animation-delay:.15s}.row:nth-child(6){animation-delay:.18s}
  .row:nth-child(7){animation-delay:.21s}.row:nth-child(8){animation-delay:.24s}
  button{transition:background .15s, border-color .15s, color .15s, transform .1s}
  button:not(:disabled):active{transform:scale(.96)}
  .stat b{transition:color .25s}
  .list{scroll-behavior:smooth}
  summary::before{transition:transform .25s cubic-bezier(.22,.61,.36,1)}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
    .list{scroll-behavior:auto}
  }

  .stats{display:flex;gap:2rem;flex-wrap:wrap;padding:.9rem 0}
  .stat b{display:block;font-size:1.3rem;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
  .stat span{font-size:.71rem;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
  .stat.alert b{color:var(--bad)}

  details{margin-top:1.5rem}
  summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:.55rem;
          padding:.4rem 0;user-select:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:'';width:0;height:0;border-left:5px solid var(--faint);
                  border-top:4px solid transparent;border-bottom:4px solid transparent;
                  transition:transform .15s;flex-shrink:0}
  details[open] summary::before{transform:rotate(90deg)}
  summary h2{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin:0}
  summary .n{font-size:.8rem;color:var(--dim);font-variant-numeric:tabular-nums}

  /* Action bar and column labels stay put; only the list scrolls. With 219 rows
     the labels disappear on the second flick otherwise. */
  .panel{border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .bar{display:flex;align-items:center;gap:.6rem;padding:.45rem .6rem;
       background:var(--hover);border-bottom:1px solid var(--line);font-size:.76rem;color:var(--dim)}
  .bar label{cursor:pointer;user-select:none;display:flex;align-items:center;gap:.35rem}
  .bar .grow{flex:1}
  .cols{display:flex;gap:.75rem;align-items:center;padding:.35rem .6rem;
        border-bottom:1px solid var(--line);font-size:.68rem;color:var(--faint);
        text-transform:uppercase;letter-spacing:.06em}
  .list{max-height:32rem;overflow-y:auto;scrollbar-width:thin;
        scrollbar-color:var(--line) transparent}
  .list::-webkit-scrollbar{width:9px}
  .list::-webkit-scrollbar-track{background:transparent}
  .list::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;
        border:2px solid var(--bg);background-clip:padding-box}
  .list::-webkit-scrollbar-thumb:hover{background:var(--faint);background-clip:padding-box}

  .row{display:flex;gap:.75rem;align-items:center;padding:.42rem .6rem;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row:hover{background:var(--hover)}
  .c-chk{width:1.1rem;flex-shrink:0}
  .c-co{width:10rem;flex-shrink:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .c-ti{flex:1;min-width:0;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .c-src{width:6.5rem;flex-shrink:0;font-size:.68rem;color:var(--faint);
         text-transform:uppercase;text-align:center}
  .c-est{width:5.2rem;flex-shrink:0;font-size:.73rem;color:var(--dim);text-align:center}
  .c-ed{width:4.5rem;flex-shrink:0;font-size:.73rem;color:var(--dim);
        font-variant-numeric:tabular-nums;text-align:center}
  .c-lnk{width:3.5rem;flex-shrink:0;text-align:center;font-size:.73rem}
  .c-act{width:11rem;flex-shrink:0;display:flex;gap:.25rem;justify-content:flex-end}

  .row.muerta{opacity:.4}
  .row a{color:inherit}
  .badge{font-size:.62rem;padding:.03rem .3rem;border-radius:3px;margin-left:.35rem;
         text-transform:uppercase;letter-spacing:.05em;vertical-align:middle}
  .badge.new{background:var(--ok);color:var(--bg);font-weight:600}
  .badge.nochance{color:var(--warn);border:1px solid var(--warn)}
  .dot{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:.35rem}
  .dot.viva{background:var(--ok)} .dot.muerta{background:var(--bad)} .dot.incierta{background:var(--faint)}
  .stale{color:var(--warn)} .dead{color:var(--bad)}

  button{font:inherit;font-size:.73rem;padding:.15rem .55rem;border-radius:4px;cursor:pointer;
         background:transparent;border:1px solid var(--line);color:var(--dim)}
  button:hover:not(:disabled){border-color:var(--dim);color:var(--fg)}
  button:disabled{opacity:.35;cursor:default}
  .empty{color:var(--dim);padding:1.1rem .6rem;font-size:.88rem}
  .outcome{text-transform:uppercase;letter-spacing:.05em;font-size:.71rem}
  .outcome.entrevista,.outcome.oferta{color:var(--ok)}
  .outcome.rechazado{color:var(--bad)}
</style>
</head>
<body>
<main>
  <header>
    <h1>job&#8209;hunter</h1>
    <span class="alerta" id="alerta"></span>
    <span class="grow"></span>
    <input id="q" type="search" placeholder="company, role or date" autocomplete="off">
    <button id="b-tel" class="ghost" hidden>costs</button>
  </header>
  <div class="stats" id="stats"></div>

  <details open>
    <summary><h2>To apply</h2><span class="n" id="n-todo"></span></summary>
    <div class="panel">
      <div class="bar">
        <label><input type="checkbox" id="all"> select all</label>
        <span id="sel-n"></span>
        <span class="grow"></span>
        <button id="b-apliq" disabled>applied</button>
        <button id="b-desc" disabled>discard</button>
      </div>
      <div class="cols">
        <span class="c-chk"></span><span class="c-co">company</span><span class="c-ti">role</span>
        <span class="c-src">source</span><span class="c-est">status</span>
        <span class="c-ed">found</span><span class="c-lnk">link</span>
      </div>
      <div class="list" id="todo"></div>
    </div>
  </details>

  <details>
    <summary><h2>Waiting</h2><span class="n" id="n-esp"></span></summary>
    <div class="panel">
      <div class="cols">
        <span class="c-co">company</span><span class="c-ti">role</span>
        <span class="c-ed">silent</span><span class="c-lnk">link</span><span class="c-act"></span>
      </div>
      <div class="list" id="esperando"></div>
    </div>
  </details>

  <details id="d-tel" hidden>
    <summary><h2>Cost and latency</h2><span class="n" id="tel-sub"></span></summary>
    <div class="panel">
      <div class="cols">
        <span class="c-co">model</span><span class="c-ti">provider</span>
        <span class="c-src">calls</span><span class="c-est">latency</span>
        <span class="c-ed">tokens</span><span class="c-lnk">cost</span>
      </div>
      <div class="list" id="tel"></div>
    </div>
  </details>

  <details open>
    <summary><h2>Answered</h2><span class="n" id="n-act"></span></summary>
    <div class="panel">
      <div class="cols">
        <span class="c-co">company</span><span class="c-ti">role</span>
        <span class="c-ed">status</span><span class="c-lnk">link</span><span class="c-act"></span>
      </div>
      <div class="list" id="activas"></div>
    </div>
  </details>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const SIN_CHANCE = /^(openai|anthropic|google|meta|amazon|apple|microsoft|netflix|nvidia|stripe|perplexity|coinbase|databricks|figma)$/i;
const ESTADO = { viva: 'live', muerta: 'gone', incierta: 'unknown' };
const silencio = d => d == null ? '' : d > 21 ? 'dead' : d > 10 ? 'stale' : '';
let data = null;

async function post(url, body) {
  await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  load();
}
const cel = (cls, html) => `<span class="${cls}">${html}</span>`;
const link = u => u ? `<a href="${esc(u)}" target="_blank" rel="noopener" title="${esc(u)}">open</a>` : '';

function filaTodo(r) {
  const d = document.createElement('div');
  d.className = 'row' + (r.alive === 'muerta' ? ' muerta' : '');
  d.innerHTML =
    cel('c-chk', `<input type="checkbox" data-id="${r.id}">`) +
    cel('c-co', esc(r.company) +
      (r.dias_desde_encontrado <= 2 ? '<span class="badge new">new</span>' : '') +
      (SIN_CHANCE.test((r.company||'').trim()) ? '<span class="badge nochance">no fit</span>' : '')) +
    cel('c-ti', esc(r.title)) +
    cel('c-src', esc(r.source || '')) +
    cel('c-est', `<span class="dot ${esc(r.alive||'incierta')}"></span>${ESTADO[r.alive] || 'unchecked'}`) +
    cel('c-ed', `${r.dias_desde_encontrado}d`) +
    cel('c-lnk', link(r.url));
  return d;
}

function filaSimple(r, meta, acciones) {
  const d = document.createElement('div');
  d.className = 'row';
  // la fecha de envío viaja en el dataset para que el buscador matchee "2026-08"
  if (r.sent_at) { d.dataset.fecha = r.sent_at.slice(0, 10); d.title = `sent ${r.sent_at.slice(0, 10)}`; }
  d.innerHTML = cel('c-co', esc(r.company)) + cel('c-ti', esc(r.title)) +
                cel('c-ed', meta) + cel('c-lnk', link(r.url));
  const acts = document.createElement('span');
  acts.className = 'c-act';
  for (const [label, outcome] of acciones) {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = () => post('/api/mark', { id: r.id, outcome });
    acts.appendChild(b);
  }
  d.appendChild(acts);
  return d;
}

function pintar(el, filas, vacio) {
  const c = $(el); c.innerHTML = '';
  if (!filas.length) { c.innerHTML = `<div class="empty">${vacio}</div>`; return; }
  filas.forEach(f => c.appendChild(f));
}

const sel = () => [...document.querySelectorAll('#todo input:checked')].map(c => +c.dataset.id);

function sync() {
  const n = sel().length;
  $('sel-n').textContent = n ? `${n} selected` : '';
  $('b-apliq').disabled = $('b-desc').disabled = n === 0;
}

async function load() {
  data = await (await fetch('/api/data')).json();
  const s = data.resumen;
  $('alerta').textContent = s.dias_desde_scout > 3
    ? `scout has not run in ${s.dias_desde_scout} days` : '';

  $('stats').innerHTML = [
    ['nuevas','new today',false], ['vivas','live',false], ['para_aplicar','pending',false],
    ['enviadas','sent',false], ['con_respuesta','answered', s.con_respuesta === 0],
  ].map(([k,l,a]) => `<div class="stat${a?' alert':''}"><b>${s[k] ?? 0}</b><span>${l}</span></div>`).join('');

  $('n-todo').textContent = data.todo.length;
  pintar('todo', data.todo.map(filaTodo), 'Nothing pending.');
  document.querySelectorAll('#todo input').forEach(c => c.onchange = sync);
  $('all').checked = false; sync();

  $('n-esp').textContent = data.esperando.length;
  pintar('esperando', data.esperando.map(r => filaSimple(r,
    `<span class="${silencio(r.dias_sin_respuesta)}">${r.dias_sin_respuesta}d</span>`,
    [['answered','respondio'], ['rejected','rechazado']])), 'Nothing waiting.');

  // Costs live behind the header button, not in the application flow.
  const tl = data.telemetria;
  if (tl && tl.total?.llamadas) {
    $('b-tel').hidden = false;
    $('tel-sub').textContent = `${tl.total.llamadas} llamadas · $${tl.total.costo ?? 0} · ${tl.total.ms_prom}ms prom`;
    pintar('tel', tl.por_modelo.map(m => {
      const d = document.createElement('div');
      d.className = 'row';
      d.innerHTML = cel('c-co', esc(m.model)) + cel('c-ti', esc(m.provider || '')) +
                    cel('c-src', m.llamadas) + cel('c-est', `${m.ms_prom}ms`) +
                    cel('c-ed', `${(m.tok_in||0) + (m.tok_out||0)}`) +
                    cel('c-lnk', m.costo != null ? `$${m.costo}` : '—');
      return d;
    }), 'No data yet.');
  }

  $('n-act').textContent = data.activas.length;
  pintar('activas', data.activas.map(r => filaSimple(r,
    `<span class="outcome ${esc(r.outcome)}">${esc(r.outcome || 'answered')}</span>`,
    [['interview','entrevista'], ['offer','oferta'], ['rejected','rechazado']])), 'Nobody answered.');
}

$('all').onchange = e => {
  document.querySelectorAll('#todo input').forEach(c => { c.checked = e.target.checked; });
  sync();
};
// Buscador: filtra por texto visible (empresa, rol, fecha) en las tres listas.
// Las filas colapsan y reaparecen animadas vía WAAPI; display:none no transiciona.
const QUIETO = matchMedia('(prefers-reduced-motion: reduce)').matches;
function verFila(row, mostrar) {
  if (row.dataset.vis !== 'off' && mostrar) return;
  if (row.dataset.vis === 'off' && !mostrar) return;
  row.dataset.vis = mostrar ? 'on' : 'off';
  if (QUIETO) { row.style.display = mostrar ? '' : 'none'; return; }
  row.style.overflow = 'hidden';
  const alto = { opacity: 1, height: row.scrollHeight + 'px', paddingTop: '', paddingBottom: '' };
  const nada = { opacity: 0, height: '0px', paddingTop: '0px', paddingBottom: '0px' };
  if (mostrar) {
    row.style.display = '';
    row.animate([nada, alto], { duration: 200, easing: 'cubic-bezier(.22,.61,.36,1)' });
  } else {
    row.animate([alto, nada], { duration: 180, easing: 'ease-out' })
      .onfinish = () => { if (row.dataset.vis === 'off') row.style.display = 'none'; };
  }
}
$('q').oninput = () => {
  const t = $('q').value.trim().toLowerCase();
  for (const row of document.querySelectorAll('.list .row')) {
    const hay = row.textContent.toLowerCase() + ' ' + (row.dataset.fecha || '');
    verFila(row, !t || hay.includes(t));
  }
  // abrir las secciones cuando hay búsqueda activa, para ver los resultados
  if (t) for (const d of document.querySelectorAll('details:not(#d-tel)')) d.open = true;
};

// Apertura suave de cada sección: el panel se despliega en vez de aparecer.
for (const det of document.querySelectorAll('details')) {
  det.addEventListener('toggle', () => {
    if (!det.open || QUIETO) return;
    const panel = det.querySelector('.panel');
    if (panel) panel.animate(
      [{ opacity: 0, transform: 'translateY(-6px)' }, { opacity: 1, transform: 'none' }],
      { duration: 220, easing: 'cubic-bezier(.22,.61,.36,1)' });
  });
}
$('b-tel').onclick = () => {
  const d = $('d-tel');
  d.hidden = !d.hidden;
  d.open = !d.hidden;
  $('b-tel').setAttribute('aria-pressed', String(!d.hidden));
};
$('b-desc').onclick = () => post('/api/bulk', { ids: sel(), accion: 'descartar' });
$('b-apliq').onclick = () => post('/api/bulk', { ids: sel(), accion: 'aplique' });

load();
setInterval(load, 60000);
</script>
</body>
</html>
